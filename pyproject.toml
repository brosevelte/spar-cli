[project]
name = "spar-cli"
version = "0.1.0"
description = "Laptop-side CLI for working with the DGX Spark over the tailnet: ssh/tmux attach, AWS SSO handoff, Chrome debug bridge, Claude config sync, file transfer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.12"]

[project.scripts]
spark = "spar_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spar_cli"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# typer's declarative style IS a function call in a default; B008 fights the framework.
ignore = ["B008"]
