# systemd drop-in: /etc/systemd/system/ssh.socket.d/10-extra-port.conf
#
# Why: Tailscale SSH owns port 22 on the tailnet address, and this tailnet's SSH policy uses
# action "check", which expires every ~12h and requires re-auth through a browser URL. Clients that
# cannot render that prompt (Blink on iOS) just hang at "Trying none...". Port 2222 reaches OpenSSH
# directly over the tailnet, authenticated by key, with no dependency on the corporate ACL.
#
# Why a socket drop-in and not sshd_config: sshd here is socket-activated (ssh.socket), so the
# listening ports come from the socket unit and a `Port` line in sshd_config is ignored entirely.
# ListenStream is a list-valued option, so this APPENDS 2222 and leaves 22 in place.
#
# Bound on all interfaces rather than pinned to the tailnet IP on purpose: if tailscaled were not up
# when ssh.socket starts, a pinned bind would fail and take port 22 down with it -- locking us out.

# Both families are listed explicitly, exactly as the base unit does for port 22. A bare
# `ListenStream=2222` binds only [::]:2222 here, and the tailnet address is IPv4 (100.x), so
# connections to it are refused.

[Socket]
ListenStream=0.0.0.0:2222
ListenStream=[::]:2222
