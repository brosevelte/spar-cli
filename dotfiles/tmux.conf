# tmux config for the Spark. Installed to ~/.tmux.conf by the bootstrap; reload with `tmux source ~/.tmux.conf`.

# ---- behaviour ---------------------------------------------------------------
# Claude Code asks for focus-events; without it a session can't tell when you switch away.
set -g focus-events on
# 0ms escape-time: the default 500ms makes ESC sluggish in Claude Code and vim over ssh.
set -sg escape-time 0
set -g history-limit 100000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# OSC 52: copying inside tmux over ssh reaches the laptop's clipboard.
set -g set-clipboard on
# tmux's own copies (mouse drag, copy mode) also go through tmux-osc52, which re-sends them in the
# one OSC 52 form mosh forwards. Without it, copying from a mosh session silently did nothing; the
# why, and why a terminal-overrides Ms fix doesn't work, is in dotfiles/tmux-osc52.sh.
set -s copy-command "~/.local/bin/tmux-osc52"
# Ghostty/modern terminals: truecolor + styled underlines.
set -g default-terminal "tmux-256color"
# Let apps send terminal graphics (kitty/iTerm image escapes) straight through to Ghostty, so an
# image viewer inside tmux over plain ssh draws real pixels. Over mosh this changes nothing: mosh
# re-renders the screen server-side and drops graphics escapes, so viewers fall back to half-block
# cells there -- that blocky picture is the viewer, not the file (`spark paste` prints the real size).
set -g allow-passthrough on
set -ga terminal-features ",*:RGB,*:usstyle,*:cstyle"
# Bar cursor, not a block: a block hides whether the cursor is ON a character or after it. cstyle
# above lets tmux forward the DECSCUSR shape to the outer terminal (Ghostty, through mosh); this is
# the default for panes whose app doesn't set its own shape.
set -g cursor-style bar

# ---- status bar: top, transparent, white bottom border -------------------------------
# bg=default leaves the cell background untouched so the terminal's own background shows through:
# the bar matches whatever Ghostty theme is active. Foregrounds are literal hex, never ANSI names,
# because a theme can map "black" to a slate blue.
# No underline: the sparkline glyphs already sit on the cell floor, so a rule one pixel below
# them read as a misaligned second baseline -- and in white it was the brightest thing on screen.
# Visible, because it carries machine vitals the laptop's menu bar cannot see: CPU, memory, GPU
# and network for the REMOTE box. `prefix + S` toggles it off when you want the screen back.
set -g status on
bind-key S set -g status
# New session from inside tmux, where `tmux new` refuses to nest: prompts for a name and switches to
# it (attaching instead if it already exists). `prefix s` lists every session to jump between.
bind-key N command-prompt -p "new session:" "new-session -A -s '%%'"

set -g status-position top
set -g status-interval 3
set -g status-justify left
set -g status-style "bg=default,fg=#b4b4b4"

set -g status-left-length 40
set -g status-left "#[bg=default,fg=#b4b4b4,bold] #S #[default]#[bg=default,fg=#6e6e6e]│ "

# sparkbar emits its own colours; ~25ms per tick, nearly all of it nvidia-smi.
set -g status-right-length 220
# No clock: every device already shows one, and on a phone the width is better spent on vitals.
set -g status-right "#[bg=default]#(~/.local/bin/sparkbar)"

setw -g window-status-style "bg=default,fg=#8a8a8a"
setw -g window-status-format " #I:#W "
setw -g window-status-current-style "bg=default,fg=#ffffff,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-activity-style "bg=default,fg=#b4b4b4"
setw -g window-status-bell-style "bg=default,fg=#ff6b6b"

# Copy mode. tmux's stock selection is bg=yellow,fg=black, which paints a neon block over whatever
# you drag across -- and with `mouse on` an accidental drag does it by itself. Search matches default
# to cyan/magenta blocks for the same reason. A dim grey selection reads as a highlight, not an error.
set -g mode-style "bg=#3a3f4b,fg=default"
set -g copy-mode-match-style "bg=#4a4130,fg=default"
set -g copy-mode-current-match-style "bg=#6b5a2e,fg=#ffffff,bold"

set -g message-style "bg=default,fg=#ffffff"
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#8a8a8a"
